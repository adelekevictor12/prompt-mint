name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "eslint.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "components.json"
      - "index.html"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/frontend.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "eslint.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "components.json"
      - "index.html"

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, Test, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate environment template
        run: yarn check:setup --warn-only

      - name: Run lint
        run: yarn lint

      - name: Run type checks
        run: yarn tsc -b --pretty false

      - name: Run tests
        run: yarn test

      - name: Build frontend
        run: yarn build

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run visual regression tests
        run: yarn test:e2e

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-regression
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
