name: Auto-rollback on deploy failure

# Issue #236 — detect a failed production deploy, revert to last known-good,
# notify Slack/Discord, and open an incident ticket.

on:
  workflow_run:
    workflows:
      - "Deploy - Frontend to Vercel and Artifacts"
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the Vercel rollback and only notify / open a ticket"
        type: boolean
        default: true
      failed_sha:
        description: "Optional failed commit SHA (defaults to the triggering run)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  rollback:
    name: Rollback, notify, and open incident
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run rollback automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'Deploy - Frontend to Vercel and Artifacts' }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'failure' }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          FAILED_SHA: ${{ inputs.failed_sha || github.event.workflow_run.head_sha || github.sha }}
          FAILED_REF: ${{ github.event.workflow_run.head_branch || github.ref }}
          FAILED_ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          FAILED_ENVIRONMENT: production
          ROLLBACK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          extra=""
          if [ "${ROLLBACK_DRY_RUN}" = "true" ]; then
            extra="--dry-run"
          fi
          yarn ops:rollback $extra
